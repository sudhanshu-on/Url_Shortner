<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShortURL | Loading</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/sw-animations.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #e9dfc7;
            --paper: #f7efd8;
            --black: #111111;
            --red: #d71920;
            --blue: #154c8b;
            --display: 'Archivo Black', 'Inter', sans-serif;
            --mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 78% 22%, rgba(17, 17, 17, 0.13) 0 2px, transparent 2px 13px),
                linear-gradient(132deg, transparent 0 45%, rgba(21, 76, 139, 0.72) 45% 49%, transparent 49%),
                linear-gradient(132deg, transparent 0 53%, rgba(215, 25, 32, 0.92) 53% 60%, transparent 60%),
                linear-gradient(22deg, transparent 0 68%, rgba(17, 17, 17, 0.94) 68% 73%, transparent 73%),
                linear-gradient(104deg, transparent 0 9%, rgba(215, 25, 32, 0.88) 9% 13%, transparent 13%),
                repeating-linear-gradient(90deg, rgba(17, 17, 17, 0.05) 0 1px, transparent 1px 38px),
                var(--bg);
            color: var(--black);
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            left: -84px;
            bottom: -74px;
            width: 310px;
            height: 310px;
            border: 34px solid var(--black);
            transform: rotate(18deg);
        }

        body::after {
            right: 5vw;
            top: 8vh;
            width: 190px;
            height: 52px;
            background: var(--blue);
            border: 4px solid var(--black);
            transform: rotate(-18deg);
        }

        .poster {
            width: min(560px, 100%);
            background: var(--paper);
            border: 4px solid var(--black);
            box-shadow: 12px 12px 0 var(--black);
            padding: 34px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .poster::before {
            content: '';
            position: absolute;
            right: -44px;
            top: 30px;
            width: 190px;
            height: 38px;
            background: var(--red);
            transform: rotate(-22deg);
        }

        .badge {
            display: inline-block;
            background: var(--black);
            color: var(--paper);
            font-family: var(--mono);
            font-size: 0.78rem;
            padding: 8px 10px;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
            animation: sw-pulse 1.4s ease-in-out infinite;
        }

        .poster {
            animation: sw-scaleIn 0.3s ease both;
        }

        h1 {
            font-family: var(--display);
            font-size: clamp(2.2rem, 10vw, 4rem);
            line-height: 0.92;
            letter-spacing: 0;
            margin: 18px 0 12px;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
        }

        p {
            color: #4a4035;
            font-weight: 900;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
        }
    </style>
    <script src="/sw-animations.js"></script>
    <script>
        async function routeUser() {
            try {
                const res = await fetch('/api/v1/auth/me');
                if (res.ok) {
                    const data = await res.json();
                    if (data.user && data.user.role === 'ADMIN') {
                        SwAnim.navigateTo('/admin');
                    } else {
                        SwAnim.navigateTo('/dashboard');
                    }
                } else {
                    SwAnim.navigateTo('/login');
                }
            } catch(e) {
                SwAnim.navigateTo('/login');
            }
        }
        routeUser();
    </script>
</head>
<body>
    <main class="poster">
        <span class="badge">Session Check</span>
        <h1>ShortURL Routing</h1>
        <p>Checking authentication state</p>
    </main>

<script src="/sw-animations.js"></script>
</body>
</html>
