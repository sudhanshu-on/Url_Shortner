<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShortURL | Shorten a URL</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/sw-animations.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <script>
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
    <style>
        :root {
            --bg: #e9dfc7;
            --paper: #f7efd8;
            --paper-deep: #e1d0a8;
            --black: #111111;
            --red: #d71920;
            --blue: #154c8b;
            --muted: #4a4035;
            --display: 'Archivo Black', 'Inter', sans-serif;
            --mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 78% 22%, rgba(17, 17, 17, 0.13) 0 2px, transparent 2px 13px),
                linear-gradient(132deg, transparent 0 45%, rgba(21, 76, 139, 0.72) 45% 49%, transparent 49%),
                linear-gradient(132deg, transparent 0 53%, rgba(215, 25, 32, 0.92) 53% 60%, transparent 60%),
                linear-gradient(22deg, transparent 0 68%, rgba(17, 17, 17, 0.94) 68% 73%, transparent 73%),
                linear-gradient(104deg, transparent 0 9%, rgba(215, 25, 32, 0.88) 9% 13%, transparent 13%),
                repeating-linear-gradient(90deg, rgba(17, 17, 17, 0.05) 0 1px, transparent 1px 38px),
                var(--bg);
            color: var(--black);
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            left: -84px;
            bottom: -74px;
            width: 310px;
            height: 310px;
            border: 34px solid var(--black);
            transform: rotate(18deg);
        }

        body::after {
            right: 5vw;
            top: 8vh;
            width: 190px;
            height: 52px;
            background: var(--blue);
            border: 4px solid var(--black);
            transform: rotate(-18deg);
        }

        .poster {
            width: min(560px, 100%);
            background: var(--paper);
            border: 4px solid var(--black);
            box-shadow: 12px 12px 0 var(--black);
            padding: 34px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .poster::before {
            content: '';
            position: absolute;
            right: -44px;
            top: 30px;
            width: 190px;
            height: 38px;
            background: var(--red);
            transform: rotate(-22deg);
        }

        .badge {
            display: inline-block;
            background: var(--black);
            color: var(--paper);
            font-family: var(--mono);
            font-size: 0.78rem;
            padding: 8px 10px;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
            animation: sw-pulse 1.4s ease-in-out infinite;
        }

        .account-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            border: 3px solid var(--black);
            margin-top: 24px;
            margin-bottom: 24px;
            position: relative;
            z-index: 1;
        }

        .account-actions a {
            padding: 11px 12px;
            background: var(--paper-deep);
            color: var(--blue);
            font-family: var(--mono);
            font-size: 0.8rem;
            font-weight: 900;
            text-align: center;
            text-transform: uppercase;
        }

        .account-actions a:first-child {
            border-right: 3px solid var(--black);
        }

        .account-actions a:hover {
            background: var(--red);
            color: #ffffff;
        }

        .poster {
            animation: sw-scaleIn 0.3s ease both;
        }

        form {
            display: grid;
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        input, button {
            border: 3px solid #111111;
            padding: 13px 14px;
            font: inherit;
        }

        button {
            background: var(--red);
            color: #ffffff;
            cursor: pointer;
            font-weight: 900;
            text-transform: uppercase;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        #result {
            display: none;
            margin-top: 18px;
            padding: 12px;
            background: #ffffff;
            border: 3px solid #111111;
            overflow-wrap: anywhere;
            position: relative;
            z-index: 1;
        }

        .result-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #resultUrl {
            flex: 1;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .copy-button {
            flex: 0 0 auto;
            padding: 10px 12px;
            background: var(--black);
            color: var(--paper);
            font-size: 0.78rem;
        }

        .copy-button:hover {
            background: var(--blue);
        }

        h1 {
            font-family: var(--display);
            font-size: clamp(2.2rem, 10vw, 4rem);
            line-height: 0.92;
            letter-spacing: 0;
            margin: 18px 0 12px;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
        }

        p {
            color: var(--muted);
            font-weight: 900;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
        }
    </style>
    <script src="/sw-animations.js"></script>
    <script>
        async function shortenUrl(event) {
            event.preventDefault();
            const form = event.currentTarget;
            const button = form.querySelector('button');
            const result = document.getElementById('result');
            const resultUrl = document.getElementById('resultUrl');
            const copyButton = document.getElementById('copyButton');
            button.disabled = true;
            button.textContent = 'Creating...';
            result.style.display = 'none';
            copyButton.style.display = 'none';

            try {
                const response = await fetch('/api/v1/shorten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({
                        url: document.getElementById('url').value,
                        custom_alias: document.getElementById('customAlias').value || undefined,
                        ttl_seconds: document.getElementById('ttlSeconds').value || undefined
                    })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Unable to create ShortURL.');
                resultUrl.textContent = data.short_url;
                copyButton.style.display = 'block';
                result.style.display = 'block';
            } catch (error) {
                resultUrl.textContent = error.message;
                result.style.display = 'block';
            } finally {
                button.disabled = false;
                button.textContent = 'Shorten URL';
            }
        }

        async function copyShortUrl() {
            const copyButton = document.getElementById('copyButton');
            const shortUrl = document.getElementById('resultUrl').textContent;

            try {
                await navigator.clipboard.writeText(shortUrl);
                copyButton.textContent = 'Copied';
                setTimeout(() => { copyButton.textContent = 'Copy'; }, 1600);
            } catch (error) {
                copyButton.textContent = 'Copy failed';
                setTimeout(() => { copyButton.textContent = 'Copy'; }, 1600);
            }
        }
    </script>
</head>
<body>
    <main class="poster">
        <span class="badge">ShortURL</span>
        <h1>Let it be short</h1>
        <p>Create short links without an account. Sign in later to manage them.</p>
        <nav class="account-actions" aria-label="Account options">
            <a href="/login">Sign in</a>
            <a href="/login#register">Sign up</a>
        </nav>
        <form onsubmit="shortenUrl(event)">
            <input id="url" type="url" placeholder="https://example.com/long-link" required>
            <input id="customAlias" type="text" minlength="3" maxlength="30" pattern="[a-zA-Z0-9_-]{3,30}" placeholder="Custom alias (optional)">
            <input id="ttlSeconds" type="number" min="1" placeholder="Expiry in seconds (optional)">
            <button type="submit">Shorten URL</button>
        </form>
        <div id="result" aria-live="polite">
            <div class="result-row">
                <span id="resultUrl"></span>
                <button id="copyButton" class="copy-button" type="button" onclick="copyShortUrl()">Copy</button>
            </div>
        </div>
    </main>

<script src="/sw-animations.js"></script>
</body>
</html>
